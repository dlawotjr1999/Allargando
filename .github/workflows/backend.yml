# ── 워크플로우 이름 ────────────────────────────────────────────
name: Backend CI

# ── 트리거 설정 ────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - "feat/**" # feature 브랜치도 포함
    paths:
      - "backend/**" # backend 폴더 변경 시에만 실행
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"

# ── 잡 정의 ───────────────────────────────────────────────────
jobs:
  test:
    runs-on: ubuntu-latest

    # ── 테스트용 PostgreSQL 컨테이너 ─────────────────────────
    # 통합 테스트에서 실제 DB가 필요할 때 사용
    # (Testcontainers를 쓰면 이 부분은 제거 가능)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: obri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # 1. 코드 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # 3. Gradle 캐시 (의존성 재사용으로 속도 향상)
      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Firebase 서비스 계정 키 생성
      # 단위 테스트는 Mock 처리라 불필요하지만,
      # 서버 컨텍스트 로드 시 FirebaseConfig가 키 파일을 찾으므로 필요
      - name: Firebase 서비스 계정 키 생성
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' \
          > backend/obri/src/main/resources/firebase-service-account.json

      # 5. Gradle 실행 권한 부여
      - name: Gradle 실행 권한 부여
        run: chmod +x backend/obri/gradlew

      # 6. 테스트 실행
      # ./gradlew test는 src/test/ 안의 모든 테스트를 실행
      - name: 테스트 실행
        working-directory: backend/obri
        run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/obri_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: test
          # Flyway(BACKLOG.md #53)가 빈 PostgreSQL 컨테이너에 스키마를 만들고, Hibernate는 validate로
          # 그 결과가 엔티티 매핑과 정확히 일치하는지만 검증 — create-drop이면 Flyway가 만든 스키마를
          # Hibernate가 곧바로 지우고 재생성해버려 마이그레이션 자체가 검증되지 않음
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      # 7. 테스트 결과 리포트 업로드 (실패 시에만)
      - name: 테스트 결과 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/obri/build/reports/tests/
          retention-days: 7

  # ── 배포 이미지 빌드 검증 ─────────────────────────────────
  # Dockerfile이 깨지면 배포 시점이 아니라 PR에서 잡히도록 빌드만 해본다(푸시·배포는 하지 않음)
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker 이미지 빌드
        run: docker build -t obri-backend backend/obri
