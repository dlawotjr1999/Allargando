spring.application.name=obri

# 로컬 실값 주입: application-local.properties(gitignore 대상). 없으면 무시(CI/운영은 환경변수 사용)
spring.config.import=optional:classpath:application-local.properties

# DB 연결 — 실값은 환경변수 또는 application-local.properties로 주입. 비밀번호는 기본값 없음(누락 시 부팅 실패로 조기 감지)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/obri}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# "user"는 PostgreSQL 예약어(CURRENT_USER류 함수와 충돌)라 Hibernate가 생성하는 모든 쿼리에서
# 반드시 큰따옴표로 감싸야 한다. User.java의 @Table(name="`user`")과 짝을 맞추는 전역 설정
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# JPA — 스키마를 손대지 않는 validate. 스키마 생성·변경은 Flyway가 전담(BACKLOG.md #53).
# 로컬 편의(create)는 application-local.properties에서만 오버라이드하며, 이때는 Flyway도 함께 꺼짐(아래 참고)
spring.jpa.hibernate.ddl-auto=validate
# 기본값(운영)은 false — 바인딩 파라미터로 개인정보(전화번호·이메일)가 로그에 남는 것을 방지(BACKLOG.md #26)
# 로컬 편의는 application-local.properties에서만 오버라이드
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Flyway (BACKLOG.md #53) — 마이그레이션 없이 스키마 변경 경로가 없던 문제를 해소.
# 기존 DB(로컬 create로 만들어진 DB·운영)는 flyway_schema_history가 없는 비어있지 않은 스키마이므로
# baseline-on-migrate로 V1을 실제 실행하지 않고 "이미 V1 상태"로만 기록 — 신규(빈) DB에서만 V1이 실행됨
spring.flyway.baseline-on-migrate=true

# 목록 API 페이지 크기 상한 — 기본 상한(2000)이면 ?size=100000 한 번으로 큰 조회가 나간다. 정렬은 PageSupport가 서버에서 고정
spring.data.web.pageable.max-page-size=50

# CORS (BACKLOG.md #36) — 네이티브 앱(iOS/Android)은 CORS 대상이 아니라서 기본값은 비워둠(전 오리진 차단).
# Expo web(브라우저) 개발 편의는 application-local.properties에서만 오버라이드.
# 운영 웹 도메인이 생기면 CORS_ALLOWED_ORIGINS 환경변수로 주입(콤마로 여러 개 구분)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Firebase 서비스 계정 키 위치 — 기본값은 로컬·CI용 classpath(resources/firebase-service-account.json).
# 운영은 키를 이미지에 넣지 않고 컨테이너 밖에서 마운트한 뒤 FIREBASE_CREDENTIALS_LOCATION=file:/경로 로 주입
firebase.credentials.location=${FIREBASE_CREDENTIALS_LOCATION:classpath:firebase-service-account.json}
spring.cloud.gcp.credentials.location=${firebase.credentials.location}

# KOPIS(공연예술통합전산망) 오픈API — 서비스키는 필수, 기본값 없음(누락 시 부팅 실패로 조기 감지, DB 비밀번호와 동일 방식)
kopis.service-key=${KOPIS_SERVICE_KEY}
# 동기화 수동 트리거(POST /api/concerts/sync) — role 체계가 없어 로그인한 누구나 호출할 수 있으므로 기본값(운영)은 꺼둠.
# 로컬 검증은 application-local.properties에서만 오버라이드
kopis.sync.manual-trigger-enabled=${KOPIS_SYNC_MANUAL_TRIGGER_ENABLED:false}

# Swagger — 기본값(운영)은 꺼둠(API 명세를 외부에 공개하지 않음). 로컬은 application-local.properties에서만 오버라이드
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}